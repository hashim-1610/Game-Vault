<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>28 — Irupathiyettu</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- ===================== AUTH VIEW ===================== -->
<section id="view-auth" class="view">
  <div class="auth-shell">
    <div class="modern-card auth-card">
      <div class="auth-logo">🃏</div>
      <h1 class="auth-title">Sign in</h1>
      <p class="auth-subtitle">to continue to <b>28 · Irupathiyettu</b></p>

      <div class="segmented-tabs" id="auth-tabs">
        <button class="seg-btn active" data-tab="login">Sign in</button>
        <button class="seg-btn" data-tab="register">Create account</button>
      </div>

      <form id="login-form" class="clean-form">
        <div class="field"><label>Username</label><input type="text" name="username" required autocomplete="username"></div>
        <div class="field"><label>Password</label><input type="password" name="password" required autocomplete="current-password"></div>
        <p class="form-error" id="login-error"></p>
        <button type="submit" class="btn btn-primary btn-block">Sign in</button>
      </form>

      <form id="register-form" class="clean-form hidden">
        <p class="form-hint">Registration requires an invite code — ask whoever's hosting this game.</p>
        <div class="field"><label>Username</label><input type="text" name="username" required></div>
        <div class="field"><label>Display name (optional)</label><input type="text" name="display_name"></div>
        <div class="field"><label>Password</label><input type="password" name="password" required></div>
        <div class="field"><label>Confirm password</label><input type="password" name="confirm_password" required></div>
        <div class="field"><label>Invite code</label><input type="text" name="invite_code" required></div>
        <div class="field file-field">
          <label>Profile picture (optional)</label>
          <input type="file" name="profile_pic" accept="image/png,image/jpeg">
        </div>
        <p class="form-error" id="register-error"></p>
        <p class="form-success" id="register-success"></p>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>
    </div>
  </div>
</section>

<!-- ===================== APP SHELL (nav + lobby/profile/leaderboard/game) ===================== -->
<section id="view-app" class="view hidden">
  <nav class="topnav">
    <div class="nav-left">
      <img id="nav-avatar" class="avatar avatar-sm" alt="">
      <span id="nav-name" class="nav-name"></span>
    </div>
    <div class="nav-tabs">
      <button class="nav-btn active" data-view="play">Play</button>
      <button class="nav-btn" data-view="profile">Profile</button>
      <button class="nav-btn" data-view="leaderboard">Leaderboard</button>
      <button class="nav-btn nav-logout" id="logout-btn">Log out</button>
    </div>
  </nav>

  <!-- ---- Play: join/create room ---- -->
  <div id="panel-play" class="panel-view">
    <div class="modern-card">
      <div class="segmented-tabs" id="play-tabs">
        <button class="seg-btn active" data-tab="join">Join a room</button>
        <button class="seg-btn" data-tab="create">Create a room</button>
      </div>
      <form id="join-form" class="clean-form">
        <div class="field"><label>Room code</label><input type="text" name="code" maxlength="5" style="text-transform:uppercase"></div>
        <p class="form-error" id="join-error"></p>
        <button type="submit" class="btn btn-primary btn-block">Join</button>
      </form>
      <form id="create-form" class="clean-form hidden">
        <label class="field-label">Mode</label>
        <div class="mode-grid" data-field="game_mode">
          <button type="button" class="mode-card active" data-value="classic">
            <div class="mode-card-icon">♠</div>
            <div class="mode-card-title">Classic</div>
            <div class="mode-card-desc">Standard 28 rules</div>
          </button>
          <button type="button" class="mode-card" data-value="royal_pair">
            <div class="mode-card-icon">♛</div>
            <div class="mode-card-title">Royal Pair</div>
            <div class="mode-card-desc">+4 bonus for K+Q of trump</div>
          </button>
        </div>
        <input type="hidden" name="game_mode" value="classic">

        <label class="field-label">Deal type</label>
        <div class="mode-grid" data-field="deal_type">
          <button type="button" class="mode-card active" data-value="half">
            <div class="mode-card-icon">✋</div>
            <div class="mode-card-title">Half Deal</div>
            <div class="mode-card-desc">Traditional — 4, bid, then 4</div>
          </button>
          <button type="button" class="mode-card" data-value="full">
            <div class="mode-card-icon">🀰</div>
            <div class="mode-card-title">Full Deal</div>
            <div class="mode-card-desc">All 8 cards upfront</div>
          </button>
        </div>
        <input type="hidden" name="deal_type" value="half">

        <div class="field"><label>Match points to win</label><input type="number" name="target_score" value="6" min="1" max="20"></div>
        <p class="form-error" id="create-error"></p>
        <button type="submit" class="btn btn-primary btn-block">Create room</button>
      </form>
    </div>
  </div>

  <!-- ---- Profile ---- -->
  <div id="panel-profile" class="panel-view hidden">
    <div class="modern-card">
      <div class="profile-header">
        <div class="avatar-upload-wrap">
          <img id="profile-avatar" class="avatar avatar-xl" alt="">
          <button type="button" class="avatar-edit-btn" id="avatar-edit-trigger" title="Change picture">✎</button>
          <input type="file" id="profile-pic-input" accept="image/png,image/jpeg" class="hidden">
        </div>
        <div class="profile-name-row">
          <input type="text" id="profile-name-input" class="profile-name-field">
          <button type="button" id="profile-name-save" class="btn btn-small btn-primary">Save</button>
        </div>
        <p class="form-hint" id="profile-pic-hint"></p>
      </div>
      <div class="stats-grid" id="profile-stats"></div>
    </div>
  </div>

  <!-- ---- Leaderboard ---- -->
  <div id="panel-leaderboard" class="panel-view hidden">
    <div class="modern-card modern-card-wide">
      <table class="lb-table" id="leaderboard-table">
        <thead><tr><th>#</th><th>Player</th><th>Games</th><th>Wins</th><th>Win rate</th><th>Streak</th></tr></thead>
        <tbody id="leaderboard-body"></tbody>
      </table>
    </div>
  </div>

  <!-- ---- Game table ---- -->
  <div id="panel-game" class="panel-view hidden">

    <!-- Lobby / waiting room -->
    <div id="room-lobby" class="modern-card hidden">
      <h3>Waiting room — room <span id="lobby-room-code"></span></h3>
      <div class="badge-row" id="lobby-badges"></div>
      <div id="lobby-seats" class="lobby-seats"></div>
      <button id="start-game-btn" class="btn btn-primary hidden">🚀 Start game</button>
      <p id="lobby-hint" class="form-hint"></p>
    </div>

    <!-- Table stage -->
    <div id="table-stage" class="table-stage hidden">
      <button id="leave-room-btn" class="stage-leave-btn">LEAVE</button>

      <div class="stage-scores">
        <div class="score-box">
          <div class="score-label">MATCH</div>
          <div class="score-row"><span>Us</span><span id="score-match-us">0</span></div>
          <div class="score-row"><span>Them</span><span id="score-match-them">0</span></div>
        </div>
        <div class="score-box">
          <div class="score-label">ROUND</div>
          <div class="score-row"><span>Us</span><span id="score-round-us">0</span></div>
          <div class="score-row"><span>Them</span><span id="score-round-them">0</span></div>
        </div>
      </div>

      <div class="seat seat-top" id="seat-top"></div>
      <div class="seat seat-left" id="seat-left"></div>
      <div class="seat seat-right" id="seat-right"></div>

      <div class="stage-center" id="stage-center"><!-- bid panel or trick, injected by JS --></div>

      <div class="stage-info-corner">
        <div class="info-box">
          <div class="info-label">THURUPPU (TRUMP)</div>
          <div class="info-value" id="info-trump">🔒 Hidden</div>
        </div>
        <div class="info-box">
          <div class="info-label">CURRENT BID</div>
          <div class="info-value" id="info-bid">—</div>
        </div>
      </div>

      <div class="hand-row" id="hand-row"></div>
      <div class="seat seat-bottom" id="seat-bottom"></div>

      <div class="stage-log-toggle-wrap">
        <button id="log-toggle-btn" class="stage-log-toggle">🏠</button>
        <div id="stage-log" class="stage-log hidden"></div>
      </div>
    </div>

    <!-- Round over / Game over overlays -->
    <div id="round-over-panel" class="modern-card hidden">
      <h3>Round over</h3>
      <p id="round-summary-text"></p>
      <button id="next-round-btn" class="btn btn-primary hidden">Deal next round ▶️</button>
      <p id="round-over-hint" class="form-hint"></p>
    </div>

    <div id="game-over-panel" class="modern-card hidden">
      <h3>🏁 Game over!</h3>
      <p id="game-over-text"></p>
      <div id="game-over-stats" class="stats-grid"></div>
      <button id="play-again-btn" class="btn btn-primary hidden">Play again (same room) ▶️</button>
      <button id="leave-after-game-btn" class="btn">Leave room</button>
    </div>
  </div>
</section>

<script src="/app.js"></script>
</body>
</html>
